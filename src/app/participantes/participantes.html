@let p = datos();
<h3 [id]="idTitulo">{{ p.titulo }}</h3>
<p class="nota">{{ p.nota }}</p>
<div class="cuerpo">
  <figure>
    <img [src]="p.insignia_imagen" [alt]="p.insignia_alt" [attr.width]="p.insignia_ancho" [attr.height]="p.insignia_alto" loading="lazy" decoding="async" />
  </figure>
  <app-tabla [columnas]="p.columnas" [filas]="p.filas" [etiquetadaPor]="idTitulo" [compacta]="true" />
</div>
