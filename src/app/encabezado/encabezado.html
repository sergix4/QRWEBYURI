<header class="portada">
  <div class="contenedor">
    <img class="logo" src="logo-uceva-55-blanco.png" width="360" height="85" alt="Universidad Central del Valle del Cauca, UCEVA, 55 años" />
    <p class="antetitulo">{{ sitio().subtitulo }}</p>
    <h1>{{ sitio().titulo_proyecto }}</h1>
    <dl class="ficha">
      <div><dt>Programa</dt><dd>{{ sitio().programa }}</dd></div>
      <div><dt>Semillero</dt><dd>{{ sitio().semillero }}</dd></div>
      <div><dt>Líder</dt><dd>{{ sitio().lider }}</dd></div>
      <div class="ancho"><dt>Evento</dt><dd>{{ sitio().evento }}</dd></div>
    </dl>
  </div>
  <div class="franja" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
</header>
