<div class="tabla-caja" [class.compacta]="compacta()">
  @if (titulo()) {
    <h3 [id]="idTitulo">{{ titulo() }}</h3>
    @if (nota()) {
      <p class="nota">{{ nota() }}</p>
    }
  }
  <table [attr.aria-labelledby]="etiquetadaPor() ?? (titulo() ? idTitulo : null)">
    <thead>
      <tr>
        @for (c of columnas(); track c) {
          <th scope="col">{{ c }}</th>
        }
      </tr>
    </thead>
    <tbody>
      @for (fila of filas(); track $index) {
        <tr>
          @for (celda of fila; track $index; let i = $index) {
            <td [attr.data-etiqueta]="columnas()[i]">{{ celda }}</td>
          }
        </tr>
      }
    </tbody>
  </table>
</div>
